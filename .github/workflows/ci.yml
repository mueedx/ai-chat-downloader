name: CI

on:
  push:
    branches: [main, '001-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and manifest check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The extension has no dependencies, so there is nothing to install. That is the
      # point: package.json carries dev tooling only.
      - name: Confirm no runtime dependencies
        run: |
          node -e "const p=require('./package.json');const n=Object.keys(p.dependencies||{}).length;if(n)throw new Error(n+' runtime dependencies declared');console.log('no runtime dependencies')"

      - name: Run tests
        run: npm test

      - name: Check the manifest and scan the source
        run: npm run check:manifest

      - name: Build the store package
        run: npm run package

      - name: Confirm the package contains no tests or specs
        run: |
          node -e "
            const {execSync}=require('node:child_process');
            const list=execSync('unzip -Z1 dist/*.zip || true').toString().trim().split('\n');
            const bad=list.filter(f=>/^(test|specs|tools|docs)\//.test(f));
            if(bad.length) throw new Error('unwanted files in the package: '+bad.join(', '));
            console.log(list.length+' files packaged');
          "
