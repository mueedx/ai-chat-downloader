name: Feature request
description: Ask for a new site, a new format, or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the solution you have in mind.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - A new site
        - A new export format
        - A change to an existing site's extraction
        - Privacy or permissions
        - Documentation or tests
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: What must stay true
      description: |
        Every change in this repository keeps the extension dependency-free, offline, and
        limited to storage plus downloads. If your idea needs any of those relaxed, say so here.
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
