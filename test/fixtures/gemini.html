    <title>Coffee brewing ratio</title>
  </head>
  <body>
    <main>
      <h1 class="conversation-title">Coffee brewing ratio</h1>
      <user-query>
        <div>What ratio do I use for pour over coffee?</div>
      </user-query>
      <model-response>
        <div class="markdown">
          <p>Start with a 1:16 ratio, so 15 g of coffee to 250 g of water.</p>
          <ul>
            <li>Rinse the filter.</li>
            <li>Bloom for 30 seconds.</li>
          </ul>
        </div>
      </model-response>
      <user-query>
        <div>What if I only have an espresso machine?</div>
      </user-query>
      <model-response>
        <div class="markdown">
          <p>Use a 1:2 ratio in 25 seconds.</p>
        </div>
      </model-response>
    </main>
